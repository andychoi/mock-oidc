# Rollback: the original upstream-image deployment this repo used before the
# Go rewrite. To switch back temporarily:
#   docker compose -f docker-compose.upstream.yml up -d
# (stop the default stack first: docker compose down)

services:
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.2
    ports:
      - "8088:8080"
    volumes:
      - ./mock-oidc.json:/config/mock-oidc.json:ro
      - ./mock-oidc-login.html:/config/mock-oidc-login.html:ro
    environment:
      - JSON_CONFIG_PATH=/config/mock-oidc.json
    restart: unless-stopped
