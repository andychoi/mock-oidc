<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock OIDC AD — ACME</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh}
.c{background:#fff;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.1);padding:2rem;width:420px}
h2{color:#0078d4;margin-bottom:.3rem}
.sub{color:#666;font-size:.85rem;margin-bottom:1.2rem}
.g{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1rem}
.b{padding:.5rem .7rem;border:1px solid #ddd;border-radius:6px;background:#fafafa;cursor:pointer;text-align:left}
.b:hover{background:#e8f0fe;border-color:#0078d4}
.b .n{font-weight:600;font-size:.9rem}
.b .r{font-size:.75rem;color:#888}
.a{border-left:3px solid #d32f2f}
.u{border-left:3px solid #1976d2}
.gs{border-left:3px solid #9e9e9e}
.d{display:flex;align-items:center;margin:1rem 0;color:#999;font-size:.8rem}
.d::before,.d::after{content:'';flex:1;border-top:1px solid #e0e0e0}
.d::before{margin-right:.8rem}.d::after{margin-left:.8rem}
label{display:block;font-size:.85rem;color:#555;margin-bottom:.3rem;font-weight:500}
input{width:100%;padding:.5rem;border:1px solid #ccc;border-radius:4px;font-size:.9rem;margin-bottom:.7rem}
.s{width:100%;padding:.6rem;background:#0078d4;color:#fff;border:none;border-radius:4px;cursor:pointer}
.lo{text-align:center;font-size:.8rem;color:#999;margin-top:.8rem}
.lo b{color:#555}
.lo a{color:#0078d4;cursor:pointer}
</style>
</head>
<body>
<div class="c">
<h2>Mock OIDC AD — ACME</h2>
<p class="sub">Dev SSO — pick a user or sign in manually (password: any value)</p>
<div class="g hidden" id="btns"></div>
<div class="d hidden" id="div">or sign in manually</div>
<form method="post" id="f">
<label>Username</label>
<input id="u" name="username" placeholder="e.g. andy, mary, kevin, admin" autocomplete="username">
<label>Password</label>
<input type="password" placeholder="any value" autocomplete="current-password">
<input id="cl" name="claims" type="hidden">
<button type="submit" class="s">Sign In</button>
</form>
<div class="lo" id="lo"></div>
</div>
<script>
// Unified user directory — one identity per person, same as production Azure AD.
// Tokens carry ONLY standard claims: name, email, preferred_username, groups, tid.
// RBAC = standard `groups` claim with app-prefixed names; each app maps its own prefix:
//   dochub-*    → DocHub roles        (e.g. dochub-admin → admin, dochub-user → user)
//   gitea-*     → Gitea teams         (e.g. gitea-maintainers → maintainers team)
//   acme-*      → org membership      (acme-employees, acme-admins)
//   platform-*  → platform-wide       (platform-admins)
// Per-project roles (owner/contributor of project X) are app data — manage them in each app, not the IdP.
//
// Quick-picks are fetched live from the server's user directory
// (maintained in the admin UI at /admin/, seeded from demo-users.json via
// USER_DIRECTORY_PATH). Any username is still accepted manually.
var TID='mock-tenant-id';
var M={};
function claims(u){return {name:u.name||u.username,email:u.email||'',preferred_username:u.email||u.username,groups:u.groups||[],tid:TID};}
function borderClass(groups){
  if(!groups||!groups.length)return 'gs';
  for(var i=0;i<groups.length;i++){if(/(^|-)admins?$/.test(groups[i]))return 'a';}
  return 'u';
}
function doLogin(username,c){
  document.getElementById('u').value=username;
  document.getElementById('cl').value=JSON.stringify(c);
  try{localStorage.setItem('mock-sso-user',username)}catch(e){}
  document.getElementById('f').submit();
}
// build quick-picks from the directory (text nodes only; no innerHTML)
function draw(users){
  var grid=document.getElementById('btns');
  for(var i=0;i<users.length;i++){
    var u=users[i];M[u.username]=claims(u);
    var b=document.createElement('button');
    b.type='button';b.className='b '+borderClass(u.groups);
    var n=document.createElement('div');n.className='n';n.textContent=u.username;
    var r=document.createElement('div');r.className='r';
    r.textContent=(u.groups&&u.groups.length?u.groups.join(', '):'guest')+(u.name?' — '+u.name:'');
    b.appendChild(n);b.appendChild(r);
    b.addEventListener('click',function(ev){
      var un=ev.currentTarget.getAttribute('data-un');
      doLogin(un,M[un]);
    });
    b.setAttribute('data-un',u.username);
    grid.appendChild(b);
  }
  if(users.length){
    grid.classList.remove('hidden');
    document.getElementById('div').classList.remove('hidden');
  }
}
fetch('/admin/api/directory').then(function(r){return r.ok?r.json():[];}).then(draw).catch(function(){});
document.getElementById('f').onsubmit=function(){
  var u=document.getElementById('u').value.trim();
  var c=M[u]||{name:u,email:u+'@demo.local',preferred_username:u+'@demo.local',groups:[],tid:TID};
  document.getElementById('cl').value=JSON.stringify(c);
  try{localStorage.setItem('mock-sso-user',u)}catch(e){}
};
var saved;try{saved=localStorage.getItem('mock-sso-user')}catch(e){}
if(saved){
  var lo=document.getElementById('lo');
  var t1=document.createTextNode('Last signed in as ');
  var b=document.createElement('b');b.textContent=saved;
  var t2=document.createTextNode(' — ');
  var a=document.createElement('a');a.textContent='forget';
  a.addEventListener('click',function(){try{localStorage.removeItem('mock-sso-user')}catch(e){}location.reload();});
  lo.appendChild(t1);lo.appendChild(b);lo.appendChild(t2);lo.appendChild(a);
}
</script>
</body>
</html>
