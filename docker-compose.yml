# Standalone Mock OIDC AD — shared dev IdP (HTTPS, the ai-gateway pattern).
#
# Consumers reach it at https://oidc.dev.test (host 443 → container 8080), not
# via Docker network — mirroring production where the OIDC AD is external.
# TLS terminates in the server itself from a mkcert PEM pair in ./tls
# (regenerate with `make tls`), served DUAL on the one listener: plain HTTP
# keeps working on :8088 for legacy consumers (mock-oidc.dev.test:8088).
#
# The server is the Go implementation built from this repo (a faithful port of
# navikt/mock-oauth2-server 6.0.2 — see docs/plan). To roll back to the
# upstream image, use docker-compose.upstream.yml.
#
# Usage:
#   make tls   # once per clone: mkcert cert into ./tls (gitignored)
#   docker compose -p infra-apps -f ../infra-apps/compose.yaml up -d --build mock-oidc
#   (the shared `infra-apps` umbrella project — see ../infra-apps/README.md; a bare
#   `docker compose up` here would relabel the container into its own project and
#   split the infra-apps group in Docker Desktop)
#
# Consumers configure:
#   OIDC_ISSUER_URL=https://oidc.dev.test/oidc   # canonical (trusted local CA)
#   http://mock-oidc.dev.test:8088/oidc          # legacy, still served
#
# Entra mode (Microsoft Entra ID emulation, see docs/entra/00-design.md):
#   per tenant:        https://oidc.dev.test/entra/{tid}/v2.0
#   multi-tenant:      https://oidc.dev.test/entra/organizations/v2.0

services:
  mock-oidc:
    build: .
    ports:
      - "443:8080"
      - "8088:8080"
    volumes:
      - ./mock-oidc.json:/config/mock-oidc.json:ro
      - ./mock-oidc-login.html:/config/mock-oidc-login.html:ro
      - ./entra-demo.json:/config/entra.json:ro
      - ./demo-users.json:/config/demo-users.json:ro
      - ./tls:/config/tls:ro
    environment:
      - JSON_CONFIG_PATH=/config/mock-oidc.json
      - ENTRA_CONFIG_PATH=/config/entra.json
      - USER_DIRECTORY_PATH=/config/demo-users.json
    restart: unless-stopped
